services:
  - type: web
    name: giant-migration-n8n
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerCommand: n8n
    envVars:
      - key: N8N_ENCRYPTION_KEY
        value: Giant2026Securen8nKey
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_CONNECTION_STRING
        sync: false
